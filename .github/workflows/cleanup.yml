---
name: Cleanup
on:
  schedule:
    - cron: "10 0 * * 1"
  workflow_dispatch:

env:
  GOPATH: /home/runner/go
  GOCACHE: /home/runner/go/cache
  GOLANGCI_LINT_CACHE: /home/runner/go/cache/lint
  GOMODCACHE: /home/runner/go/mod
  GOPROXY: https://proxy.golang.org
  GOTOOLCHAIN: local

jobs:
  cleanup:
    name: Cleanup
    # hanzo-build-linux-amd64, not `server`. A runs-on label that matches no
    # registered runner does not fail — it never dispatches, so the job reports
    # zero steps and the run is red with an empty log. The fleet advertises the
    # org pools (hanzo-*/lux-*/zoo-*) plus self-hosted/linux/amd64; `server` is
    # not among them, so this job has never run.
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # for `git describe` to work
          lfs: false # LFS is used only by website

      - name: Setup Go
        # actions/setup-go, not hanzoai/github-actions/setup-go: that repo does
        # not exist. The reference is rebrand damage — upstream is
        # FerretDB/github-actions (which is live), the org was renamed by a
        # find-replace, and the renamed repo was never created. The runner cannot
        # resolve the action, so the job dies before its first step:
        #   Unable to clone .../hanzoai/github-actions: Repository not found
        # It took no inputs here, so the official action with go-version-file is
        # an exact replacement and drops a dependency on a repo we do not own.
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        run: go generate -x
        working-directory: tools

      - name: Run docker-cleanup
        run: bin/task docker-cleanup

      - name: Clean Go caches
        run: go clean -cache -testcache -modcache -fuzzcache
