---
name: Cleanup
on:
  schedule:
    - cron: "10 0 * * 1"
  workflow_dispatch:

env:
  GOPATH: /home/runner/go
  GOCACHE: /home/runner/go/cache
  GOLANGCI_LINT_CACHE: /home/runner/go/cache/lint
  GOMODCACHE: /home/runner/go/mod
  GOPROXY: https://proxy.golang.org
  GOTOOLCHAIN: local

jobs:
  cleanup:
    name: Cleanup
    # hanzo-build-linux-amd64, not `server`. A runs-on label that matches no
    # registered runner does not fail — it never dispatches, so the job reports
    # zero steps and the run is red with an empty log. The fleet advertises the
    # org pools (hanzo-*/lux-*/zoo-*) plus self-hosted/linux/amd64; `server` is
    # not among them, so this job has never run.
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # for `git describe` to work
          lfs: false # LFS is used only by website

      - name: Setup Go
        uses: hanzoai/github-actions/setup-go@main
        # no cache-key on server

      - name: Install Task
        run: go generate -x
        working-directory: tools

      - name: Run docker-cleanup
        run: bin/task docker-cleanup

      - name: Clean Go caches
        run: go clean -cache -testcache -modcache -fuzzcache
