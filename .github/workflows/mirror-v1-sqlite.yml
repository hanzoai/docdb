name: Mirror v1 SQLite image

# Publishes ghcr.io/hanzoai/docdb:1.24.0-sqlite — the SQLite-backed FerretDB v1
# variant of DocDB that the managed "docdb" cloud product provisions per-org
# (cloud dedicated.go): MongoDB wire protocol on :27017 backed by Hanzo SQL
# (SQLite) — no mongod, no Postgres.
#
# main / v1.24.3 of THIS repo hardwire DocumentDB/PostgreSQL (they back the
# shared chat-docdb). FerretDB v1 upstream is the last line carrying the
# pluggable SQLite backend handler, so the SQLite variant is the pinned
# upstream FerretDB v1.24.0 image republished under our own package with the
# distinguishing `1.24.0-sqlite` tag. Pinned by digest; amd64 (DOKS is
# amd64-only — arm64 paused per hanzo build policy). Re-run (workflow_dispatch)
# only to re-pin to a new FerretDB v1 patch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-v1-sqlite.yml'

permissions:
  packages: write
  contents: read

env:
  SOURCE_IMAGE: ghcr.io/ferretdb/ferretdb:1.24.0@sha256:e4e442895ae2aaf8284db3d012c8d0e1c84d6f353d16678a0d3edf6d7e81d624
  TARGET_IMAGE: ghcr.io/hanzoai/docdb:1.24.0-sqlite

jobs:
  mirror:
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull, retag, push (amd64)
        run: |
          docker pull --platform linux/amd64 "${{ env.SOURCE_IMAGE }}"
          docker tag "${{ env.SOURCE_IMAGE }}" "${{ env.TARGET_IMAGE }}"
          docker push "${{ env.TARGET_IMAGE }}"

      - name: Verify wire compat + SQLite at rest
        run: |
          set -euo pipefail
          docker network create ferret-ci || true
          docker volume create ferret-ci-vol
          docker run -d --name ferret-ci --network ferret-ci -v ferret-ci-vol:/state \
            -e FERRETDB_HANDLER=sqlite \
            -e FERRETDB_SQLITE_URL=file:/state/ \
            -e FERRETDB_STATE_DIR=/state \
            -e FERRETDB_LISTEN_ADDR=:27017 \
            -e FERRETDB_TEST_ENABLE_NEW_AUTH=true \
            -e FERRETDB_SETUP_USERNAME=admin \
            -e FERRETDB_SETUP_PASSWORD=ci-verify-pw \
            -e FERRETDB_SETUP_DATABASE=events \
            "${{ env.TARGET_IMAGE }}"
          for i in $(seq 1 40); do
            if docker run --rm --network ferret-ci mongo:7 \
                mongosh "mongodb://admin:ci-verify-pw@ferret-ci:27017/events?authSource=events" \
                --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 1
          done
          docker run --rm --network ferret-ci mongo:7 \
            mongosh "mongodb://admin:ci-verify-pw@ferret-ci:27017/events?authSource=events" --quiet --eval '
              db.orders.insertOne({_id:1,item:"widget",qty:3});
              db.orders.updateOne({_id:1},{$set:{qty:42}});
              if (db.orders.findOne({_id:1}).qty !== 42) { throw "update failed"; }
              db.orders.deleteOne({_id:1});
              if (db.orders.countDocuments({}) !== 0) { throw "delete failed"; }
              print("WIRE-CRUD-OK maxWireVersion=" + db.hello().maxWireVersion);
            '
          docker run --rm -v ferret-ci-vol:/state alpine:3 sh -c '
            test "$(head -c 15 /state/events.sqlite)" = "SQLite format 3" || { echo "NOT SQLITE AT REST"; exit 1; }
            if ls /state | grep -iqE "wiredtiger|\.wt$|PG_VERSION|pg_wal"; then echo "FOUND mongod/postgres artifacts"; exit 1; fi
            echo "SQLITE-AT-REST-OK"'
          docker rm -f ferret-ci; docker volume rm ferret-ci-vol; docker network rm ferret-ci

      - name: Write job summary
        run: |
          {
            echo "## DocDB v1 SQLite image published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Source | \`${{ env.SOURCE_IMAGE }}\` |"
            echo "| Target | \`${{ env.TARGET_IMAGE }}\` |"
            echo "| Backend | FerretDB v1 SQLite handler (Hanzo SQL) — no mongod, no Postgres |"
          } >> "$GITHUB_STEP_SUMMARY"
